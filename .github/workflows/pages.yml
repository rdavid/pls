#
# The deploy job needs pages: write to publish the built site and
# id-token: write for the OIDC token actions/deploy-pages requires.
# Pull requests build the site without deploying it.
---
name: pages
'on':
  pull_request:
    paths: &paths
      - README.adoc
      - .github/pages/**
      - .github/workflows/pages.yml
  push:
    branches: [master]
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: sh
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes asciidoctor
      - run: |
          mkdir _site
          cp .github/pages/favicon.svg _site/favicon.svg
          asciidoctor \
            --attribute docinfo=private \
            --attribute docinfodir=.github/pages \
            --attribute pages-build \
            --failure-level WARN \
            --out-file _site/index.html \
            README.adoc
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
