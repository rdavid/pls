# The rubocop job needs pull-requests: write so reviewdog can post
# review comments.
---
name: rubocop
'on':
  pull_request:
    paths: &paths
      - 'bin/**'
      - 'lib/**'
      - 'test/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'Rakefile'
      - 'pls.gemspec'
      - '.rubocop.yml'
      - '.github/workflows/rubocop.yml'
  push:
    branches: [master]
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rubocop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pull-requests: write
    env:
      BUNDLE_ONLY: rubocop
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: 3.2
          bundler-cache: true
      - uses: reviewdog/action-rubocop@v2.22.0
        with:
          reporter: github-pr-review  # Default is github-pr-check
          skip_install: true
          use_bundler: true
