#
# The test job runs the suite without write access. The release job needs
# contents: write to create the GitHub Release and upload gem assets, and
# id-token: write for OIDC trusted publishing to RubyGems.
---
name: release
'on':
  push:
    tags: ['*.*.*']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1.342.0
        with:
          ruby-version: '3.2'
          bundler-cache: false
      - run: |
          bundle install
          bundle exec rake
  release:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1.342.0
        with:
          ruby-version: '3.2'
          bundler-cache: false
      - run: bundle install
      - uses: rubygems/release-gem@v1.4.2
      - run: gh release create "${GITHUB_REF_NAME}" pkg/*.gem
          --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
